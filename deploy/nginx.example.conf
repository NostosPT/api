# nginx on the public VPS (use this instead of Caddy if you already run nginx).
# 10.8.0.2 = the CT's WireGuard address (BIND_ADDRESS in .env.prod).
# Certificates: certbot or similar; paths below are placeholders.

server {
    listen 443 ssl;
    http2 on;
    server_name api.nostos.pt;
    ssl_certificate     /etc/letsencrypt/live/api.nostos.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nostos.pt/privkey.pem;

    location / {
        proxy_pass http://10.8.0.2:4000;
        proxy_set_header Host $host;
        # The API only trusts this header from TRUST_PROXY, so it can't be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.nostos.pt;
    ssl_certificate     /etc/letsencrypt/live/media.nostos.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.nostos.pt/privkey.pem;

    # Originals are uploaded straight to storage and can be large:
    # no size limit, and stream them through the tunnel instead of buffering on the VPS.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    location / {
        proxy_pass http://10.8.0.2:8333;
        # Presigned URLs are signed for this host name.
        proxy_set_header Host $host;
    }
}

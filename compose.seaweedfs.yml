name: nostos-storage

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      # The same credentials are used by the API. Store their values only in
      # .env; never commit that file.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      # SeaweedFS creates this bucket on startup when it does not yet exist.
      S3_BUCKET: ${S3_BUCKET:-nostos-originals}
    command:
      # `mini` runs a single-node master, volume server, filer and S3 gateway.
      # SeaweedFS reads the AWS_* credentials and creates S3_BUCKET at startup.
      - mini
      - -dir=/data
      - -s3
      - -s3.port=8333
      # Direct browser PUTs use presigned URLs, so the dashboard origin must
      # be allowed. Comma-separate production origins in .env when needed.
      - -s3.allowedOrigins=${SEAWEED_S3_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${SEAWEED_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:

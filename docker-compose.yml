name: nostos

# Local stack: Postgres + S3-compatible storage (SeaweedFS) + migrations + API.
#   docker compose up --build              -> everything
#   docker compose up -d postgres s3       -> just the dependencies (for `pnpm dev`)

x-api-env: &api-env
  DATABASE_URL: postgresql://nostos:nostos@postgres:5432/nostos
  COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me-please-32+}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  S3_REGION: us-east-1
  S3_BUCKET: nostos
  S3_ACCESS_KEY_ID: nostos
  S3_SECRET_ACCESS_KEY: nostos-dev-secret
  S3_ENDPOINT: http://s3:8333
  # Browsers can't resolve `s3`, so presigned URLs are signed for the host-mapped port.
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nostos
      POSTGRES_PASSWORD: nostos
      POSTGRES_DB: nostos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostos -d nostos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development. In production point
  # the S3_* variables at AWS S3 (or any S3-compatible provider) instead.
  s3:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=s3 -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      -s3.allowedOrigins=${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *api-env
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  s3-data:

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma 7 does not generate the client on install. prisma.config.ts
      # resolves DATABASE_URL eagerly; generate never connects, so a
      # placeholder is enough (same as the Dockerfile build stage).
      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

  version:
    name: Bump version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump version
        id: bump
        run: node scripts/bump-version.js patch

      - name: Commit and tag new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add package.json src/config/api-version.ts
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to ${VERSION}"
            git tag "v${VERSION}"
            git pull --rebase origin main
            git push origin main --tags
          fi
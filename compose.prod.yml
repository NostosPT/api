name: nostos-prod

# Production stack for the Debian CT. Public traffic arrives through the WireGuard
# reverse proxy; see deploy/README.md.
#
#   docker compose -f compose.prod.yml --env-file .env.prod up -d --build
#
# Only `api` (3000) and `s3` (8333) are published, and only on BIND_ADDRESS
# (the CT's WireGuard/LAN IP). Postgres is never published.

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: local # rotated by default (5 x 20 MB per container)

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://nostos:${POSTGRES_PASSWORD:?}@postgres:5432/nostos
  COOKIE_SECRET: ${COOKIE_SECRET:?}
  COOKIE_SECURE: "true"
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  TRUST_PROXY: ${TRUST_PROXY:?}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-nostos}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?}
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nostos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: nostos
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostos -d nostos"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    <<: *restart
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/nostos-entrypoint.sh"]
    # externalUrl: signatures are verified against the public media URL, so
    # presigned links keep working even if the proxy rewrites the Host header.
    command: >
      server -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=8333
      -s3.externalUrl=${S3_PUBLIC_ENDPOINT:?}
      -s3.allowedOrigins=${CORS_ORIGINS:?}
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    ports:
      - "${BIND_ADDRESS:?}:8333:8333"
    volumes:
      - s3-data:/data
      - ./docker/seaweedfs/entrypoint.sh:/nostos-entrypoint.sh:ro

  # Runs before every API (re)start: migrations, bucket creation, first admin.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: "no"

  api:
    <<: *restart
    build:
      context: .
      target: runtime
    environment:
      <<: *api-env
    ports:
      - "${BIND_ADDRESS:?}:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  s3-data:
